title: Local User Account Creation and Group Manipulation via Net.exe
id: e1469fa3-1001-48de-9f12-socforge100105
status: test
description: Detects local account creation and addition of users to local security groups using net.exe or net1.exe.
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1098/
author: SOCForge Detection Engineering Team
date: 2026-08-28
tags:
  - attack.persistence
  - attack.t1136.001
  - attack.privilege_escalation
  - attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_flags:
    CommandLine|contains:
      - '/add'
      - '/Add'
      - '-add'
      - '-Add'
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate local administrator provisioning by IT support
level: high
