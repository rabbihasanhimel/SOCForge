title: Suspicious Encoded PowerShell Command Execution
id: a4c95f12-1001-4d3b-9e2f-socforge100101
status: test
description: Detects PowerShell command line execution utilizing Base64 encoded command arguments (-EncodedCommand, -enc) to hide script intent.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: SOCForge Detection Engineering Team
date: 2026-08-28
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-encodedcommand'
      - '-enc '
      - '-Enc '
      - '-e '
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate automated enterprise management tools executing encoded scripts
level: high
