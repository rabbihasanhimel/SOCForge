title: Windows Command Prompt Spawned by PowerShell
id: b8314e6d-1001-45a7-b123-socforge100102
status: test
description: Detects the Windows Command Prompt (cmd.exe) being spawned as a child process of PowerShell, often indicating subshell execution or living-off-the-land commands.
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: SOCForge Detection Engineering Team
date: 2026-08-28
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    Image|endswith:
      - '\cmd.exe'
  condition: selection
falsepositives:
  - Legitimate batch script execution initiated from a PowerShell administrator session
level: medium
